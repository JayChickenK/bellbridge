# TwinBus Analyzer: first-look recording firmware (concept board, see ../README.md).
# Receive-only. It logs every pulse train the two edge comparators see, with the
# length of each pulse and gap in microseconds, plus the bus voltage, the station
# current and the apartment-door button. Watch the logs with
#   esphome logs twinbus-analyzer.yaml
# (over USB or Wi-Fi) and note what you did when each burst appeared.
# Secrets: copy ../../../firmware/secrets.yaml.example to secrets.yaml next to this file.

esphome:
  name: twinbus-analyzer
  friendly_name: TwinBus Analyzer

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

# OTA encrypted with the API key, as in BellBridge (needs ESPHome 2026.9.0 or later).
ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Edge comparators. CMP_HI goes high while the AC part of the bus voltage is above
# +threshold, CMP_LO while it is below -threshold. Each burst is logged as
# "Received Raw: ..." with positive numbers for high and negative for low (µs).
remote_receiver:
  - id: rx_hi
    pin: GPIO18
    dump: raw
    idle: 20ms
    filter: 5us
    buffer_size: 10kb
  - id: rx_lo
    pin: GPIO20
    dump: raw
    idle: 20ms
    filter: 5us
    buffer_size: 10kb

# Comparator thresholds from two PWM outputs (RC-filtered on the board).
output:
  - platform: ledc
    id: th_hi_pwm
    pin: GPIO22
    frequency: 20kHz
  - platform: ledc
    id: th_lo_pwm
    pin: GPIO23
    frequency: 20kHz

number:
  - platform: template
    name: "Edge threshold"
    icon: mdi:sine-wave
    unit_of_measurement: "V"
    min_value: 0.05
    max_value: 2.5
    step: 0.05
    initial_value: 0.3
    optimistic: true
    restore_value: true
    entity_category: config
    # x is in volts on the bus. The AC channel shows the bus voltage /21 x 11,
    # i.e. 0.524 V per volt, centred on 1.65 V; the PWM runs from 3.3 V.
    on_value:
      - output.set_level:
          id: th_hi_pwm
          level: !lambda "return (1.65f + 0.524f * x) / 3.3f;"
      - output.set_level:
          id: th_lo_pwm
          level: !lambda "return (1.65f - 0.524f * x) / 3.3f;"

sensor:
  - platform: adc
    pin: GPIO2
    name: "Bus voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    attenuation: 12db
    update_interval: 1s
    filters:
      - multiply: 21.0
  - platform: adc
    pin: GPIO3
    name: "Station current"
    unit_of_measurement: "mA"
    accuracy_decimals: 1
    attenuation: 12db
    update_interval: 1s
    filters:
      # 1 ohm shunt, AMC1300B (x8.2), difference amplifier x0.6 around 1.65 V.
      - offset: -1.65
      - multiply: 203.3

binary_sensor:
  - platform: gpio
    pin: GPIO19
    name: "Apartment door button (ED)"
    filters:
      - delayed_on_off: 20ms
